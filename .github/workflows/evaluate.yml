name: Test RAG

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run test
        env:
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
        run: |
          pip install cohere python-dotenv
          python -c "
import cohere
import os
print('Cohere version:', cohere.__version__)
print('API key exists:', bool(os.getenv('COHERE_API_KEY')))
"